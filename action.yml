name: Deployment Manifest
description:
  git action that maintains a deployment manifest of the matrix of environments, deployables,
  versions, and statuses
author: dkhunt27

branding:
  icon: command
  color: blue

# Define your inputs here.
inputs:
  command:
    description:
      'Deployment manifest command to run. Options: "addNewDeployable", "getDeployableList",
      "markDeployed"'
    required: true
  ifAddNewDeployableExists:
    description:
      'Flag to indicate what to do if the new deployable exists. Options: "error" (default),
      "ignore", "update"'
    required: false
    default: 'error'
  version:
    description: 'Version of the deployable to work with'
    required: true
  fallbackEnv:
    description:
      'Env name (e.g. "qa") when set, will deploy all apps/versions from this "fallbackEnv" to 
      the target "env" for every app that does not have a "version".  So this can be used to bring
      your target "env" up to date with "fallbackEnv" while also deploying all the change apps that
      match "version". Leave empty for version-only results (only for getDeployableList command)'
    required: false
    default: ''
  actor:
    description: 'Actor performing the deployment action'
    required: true
  deployables:
    description:
      'List of deployables to perform the "command" against or restrict results to --
      Comma-separated list of deployables (required for addNewDeployable,markDeployed commands)'
    required: false
    default: ''
  env:
    description: 'Env to perform command against (only for markDeployed command)'
    required: false
  deployedToProd:
    description:
      '"true": deployable was deployed to production; "false": it was not (only for markDeployed
      command)'
    required: false
  deployableTable:
    description: 'Name of the deployable table'
    required: true
  deployedTable:
    description: 'Name of the deployed table'
    required: true
  awsRegion:
    description: 'AWS region (defaults to us-east-1)'
    required: false
runs:
  using: node24
  main: dist/index.js
